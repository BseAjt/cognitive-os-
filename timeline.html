<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MemoryOS — Reasoning Timeline</title><style>:root{--bg:#08111f;--panel:#111c2e;--line:rgba(255,255,255,.09);--text:#f4f7fb;--muted:#94a2b8;--accent:#8b6cff}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at 80% 0,rgba(139,108,255,.16),transparent 30%),var(--bg);color:var(--text)}button,select{font:inherit}.top{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid var(--line);background:rgba(8,17,31,.8);position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#a28bff,#623ef0);font-weight:900}.muted{color:var(--muted)}main{max-width:1300px;margin:auto;padding:38px}.hero{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:24px}.hero h1{font-size:40px;margin:7px 0}.hero p{margin:0;color:var(--muted)}.eyebrow,.tag{font-size:11px;letter-spacing:.12em;color:#9c8aef;font-weight:900}.primary{border:0;border-radius:12px;padding:13px 17px;background:linear-gradient(135deg,#8b6cff,#6742ee);color:white;font-weight:800;cursor:pointer}.card{background:rgba(17,28,46,.94);border:1px solid var(--line);border-radius:17px;padding:20px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}.summary strong{display:block;font-size:27px;margin-top:6px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.toolbar select,.toolbar button{border:1px solid var(--line);background:#101a2b;color:var(--text);padding:9px 11px;border-radius:10px}.timeline{position:relative;padding-left:35px}.timeline:before{content:"";position:absolute;left:11px;top:8px;bottom:8px;width:2px;background:linear-gradient(var(--accent),rgba(139,108,255,.08))}.event{position:relative;padding-bottom:24px}.event:before{content:"";position:absolute;left:-29px;top:7px;width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 5px rgba(139,108,255,.15)}.event-card{border:1px solid var(--line);border-radius:14px;padding:15px;background:rgba(255,255,255,.025);cursor:pointer}.event-card:hover,.event.active .event-card{border-color:rgba(139,108,255,.55);background:rgba(139,108,255,.08)}.event-head{display:flex;justify-content:space-between;gap:12px}.event p,.version p{line-height:1.5}.date{font-size:12px;color:var(--muted)}.details{position:sticky;top:94px;align-self:start}.version{border:1px solid var(--line);border-radius:12px;padding:13px;margin-top:12px}.version small{display:block;color:var(--muted);margin-bottom:6px}.old{color:#ffb3bd;text-decoration:line-through}.new{color:#bdf3df}.empty{text-align:center;color:var(--muted);padding:30px;border:1px dashed var(--line);border-radius:12px}@media(max-width:900px){.layout{grid-template-columns:1fr}.details{position:static}}@media(max-width:650px){main{padding:24px 15px}.hero{display:block}.hero .primary{margin-top:15px}.summary{grid-template-columns:1fr}.hero h1{font-size:33px}}</style></head><body><header class="top"><div class="brand"><div class="logo">M</div><div><strong>MemoryOS</strong><div class="muted">Reasoning Timeline</div></div></div><span class="muted">Sauvegarde locale active</span></header><main><div class="hero"><div><div class="eyebrow">ITÉRATION 4</div><h1>Rejouer l’évolution de ta pensée.</h1><p>Chaque mémoire devient une étape datée, comparable et réutilisable.</p></div><button class="primary" id="seed">Charger une évolution démo</button></div><div class="summary"><article class="card"><span class="muted">Étapes</span><strong id="count">0</strong></article><article class="card"><span class="muted">Révisions</span><strong id="revisions">0</strong></article><article class="card"><span class="muted">Dernière évolution</span><strong id="last">—</strong></article></div><div class="layout"><article class="card"><div class="toolbar"><select id="type"><option value="all">Tous les types</option><option value="decision">Décisions</option><option value="hypothesis">Hypothèses</option><option value="question">Questions</option><option value="argument">Arguments</option><option value="fact">Faits</option></select><button id="order">Plus récent d’abord</button></div><div id="list" class="timeline"></div></article><aside class="card details"><div class="eyebrow">COMPARAISON DE VERSION</div><div id="details"><div class="empty">Sélectionne une étape pour comparer son évolution.</div></div></aside></div></main><script>const labels={fact:'FAIT',hypothesis:'HYPOTHÈSE',decision:'DÉCISION',question:'QUESTION',argument:'ARGUMENT'};let memories=JSON.parse(localStorage.getItem('memoryos.memories')||'[]'),newest=true,selected=null;const esc=v=>String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));function events(){return memories.flatMap(m=>m.items.map((x,i)=>({...x,id:m.id+'-'+i,date:m.date,source:m.source,raw:m.text}))).sort((a,b)=>newest?new Date(b.date)-new Date(a.date):new Date(a.date)-new Date(b.date))}function render(){let ev=events(),t=document.getElementById('type').value;if(t!=='all')ev=ev.filter(x=>x.type===t);count.textContent=ev.length;revisions.textContent=Math.max(0,ev.length-memories.length);last.textContent=ev[0]?new Date(ev[0].date).toLocaleDateString('fr-FR'):'—';list.innerHTML=ev.length?ev.map(x=>`<div class="event ${selected===x.id?'active':''}" data-id="${x.id}"><div class="event-card"><div class="event-head"><span class="tag">${labels[x.type]}</span><span class="date">${new Date(x.date).toLocaleString('fr-FR')}</span></div><strong>${esc(x.source)}</strong><p>${esc(x.text)}</p></div></div>`).join(''):'<div class="empty">Aucune étape disponible. Charge la démonstration ou crée des mémoires dans Memory Engine.</div>';document.querySelectorAll('[data-id]').forEach(el=>el.onclick=()=>select(el.dataset.id,ev))}function select(id,ev){selected=id;const cur=ev.find(x=>x.id===id),same=events().filter(x=>x.type===cur.type&&x.id!==id);const prev=same.filter(x=>new Date(x.date)<new Date(cur.date)).sort((a,b)=>new Date(b.date)-new Date(a.date))[0],next=same.filter(x=>new Date(x.date)>new Date(cur.date)).sort((a,b)=>new Date(a.date)-new Date(b.date))[0];details.innerHTML=`<div class="version"><small>Version sélectionnée</small><strong>${labels[cur.type]}</strong><p>${esc(cur.text)}</p></div>${prev?`<div class="version"><small>Version antérieure</small><p class="old">${esc(prev.text)}</p></div>`:'<div class="version"><small>Version antérieure</small><span class="muted">Première formulation connue</span></div>'}${next?`<div class="version"><small>Version suivante</small><p class="new">${esc(next.text)}</p></div>`:'<div class="version"><small>Version suivante</small><span class="muted">Aucune évolution ultérieure</span></div>'}<div class="version"><small>Contexte source</small><p>${esc(cur.raw.slice(0,220))}${cur.raw.length>220?'…':''}</p></div>`;render()}type.onchange=render;order.onclick=()=>{newest=!newest;order.textContent=newest?'Plus récent d’abord':'Plus ancien d’abord';render()};seed.onclick=()=>{const n=Date.now();memories=[{id:n-3,date:new Date(n-1555200000).toISOString(),source:'Réflexion initiale',text:'MemoryOS pourrait être une application de notes enrichies.',items:[{type:'hypothesis',text:'MemoryOS doit surtout mieux organiser les notes.',approved:true},{type:'question',text:'Comment classer automatiquement les contenus ?',approved:true}]},{id:n-2,date:new Date(n-777600000).toISOString(),source:'Entretien utilisateur',text:'Les utilisateurs regrettent surtout le raisonnement perdu.',items:[{type:'fact',text:'Les utilisateurs oublient davantage le chemin de décision que les notes.',approved:true},{type:'hypothesis',text:'MemoryOS doit préserver le contexte et les raisons derrière chaque conclusion.',approved:true}]},{id:n-1,date:new Date(n-172800000).toISOString(),source:'Décision produit',text:'Le produit sera centré sur la continuité du raisonnement.',items:[{type:'decision',text:'Prioriser l’écran « Là où tu en étais » dans le MVP.',approved:true},{type:'hypothesis',text:'La continuité du raisonnement est la proposition de valeur centrale de MemoryOS.',approved:true},{type:'question',text:'Quel niveau d’automatisation maintient la confiance utilisateur ?',approved:true}]}];localStorage.setItem('memoryos.memories',JSON.stringify(memories));render()};render();</script></body></html>
