<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MemoryOS — AI Mentor</title><style>:root{--bg:#08111f;--panel:#111c2e;--line:rgba(255,255,255,.09);--text:#f4f7fb;--muted:#94a2b8;--accent:#8b6cff}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at 78% 0,rgba(139,108,255,.18),transparent 31%),var(--bg);color:var(--text)}button,textarea{font:inherit}.app{display:grid;grid-template-columns:270px 1fr;min-height:100vh}.side{padding:22px 18px;border-right:1px solid var(--line);background:#07101d}.brand{display:flex;gap:12px;align-items:center;margin-bottom:24px}.logo{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#a28bff,#623ef0);font-weight:900}.brand span,.muted{color:var(--muted)}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:var(--muted);text-align:left;padding:11px;border-radius:10px}.nav .active{background:rgba(139,108,255,.14);color:#fff}.main{min-width:0}.top{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 30px;border-bottom:1px solid var(--line)}.content{padding:34px;max-width:1450px;margin:auto}.hero{display:flex;justify-content:space-between;align-items:end;margin-bottom:22px}.hero h1{font-size:40px;margin:6px 0}.primary{border:0;border-radius:12px;background:linear-gradient(135deg,#8b6cff,#6742ee);color:#fff;font-weight:800;padding:13px 17px;cursor:pointer}.layout{display:grid;grid-template-columns:340px 1fr;gap:20px}.card{background:rgba(17,28,46,.92);border:1px solid var(--line);border-radius:17px;padding:19px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{border:1px solid var(--line);border-radius:12px;padding:12px}.stat strong{display:block;font-size:24px}.ctx{margin-top:13px;display:grid;gap:9px}.ctx div{padding:12px;border:1px solid var(--line);border-radius:12px}.ctx span{display:block;font-size:12px;color:var(--muted);margin-top:5px}.chat{padding:0;display:grid;grid-template-rows:auto 1fr auto;min-height:650px}.chathead{padding:18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.messages{padding:22px;overflow:auto;max-height:550px}.msg{display:flex;gap:10px;margin-bottom:17px}.msg.user{justify-content:flex-end}.bubble{max-width:78%;padding:14px 16px;border-radius:16px;background:#17243a;border:1px solid var(--line);line-height:1.5}.user .bubble{background:linear-gradient(135deg,#7857ef,#6240d7);border:0}.avatar{width:34px;height:34px;border-radius:11px;background:#26344d;display:grid;place-items:center}.sources{font-size:12px;color:var(--muted);border-top:1px solid var(--line);margin-top:9px;padding-top:9px}.quick{display:flex;gap:8px;flex-wrap:wrap;padding:0 18px 14px}.quick button,.ghost{border:1px solid var(--line);background:#101a2b;color:var(--muted);border-radius:999px;padding:8px 11px;cursor:pointer}.composer{display:grid;grid-template-columns:1fr auto;gap:10px;padding:16px;border-top:1px solid var(--line)}textarea{min-height:58px;background:#0d1727;color:#fff;border:1px solid var(--line);border-radius:13px;padding:13px;resize:vertical}.empty{padding:25px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}@media(max-width:900px){.layout{grid-template-columns:1fr}.app{grid-template-columns:1fr}.side{display:none}} </style></head><body><div class="app"><aside class="side"><div class="brand"><div class="logo">M</div><div><strong>MemoryOS</strong><span>Cognitive Operating System</span></div></div><nav class="nav"><button>⌂ Command Center</button><button>✦ Memory Engine</button><button>⌘ Knowledge Graph</button><button>◷ Reasoning Timeline</button><button>◇ Decision Engine</button><button>◉ Reflection Engine</button><button class="active">✺ AI Mentor</button></nav></aside><main class="main"><header class="top"><div>MemoryOS / <strong>AI Mentor</strong></div><span class="muted">● Contexte local</span></header><section class="content"><div class="hero"><div><div class="muted">ITÉRATION 7</div><h1>Continue ton raisonnement.</h1><p class="muted">Le mentor exploite tes mémoires, décisions et réflexions locales.</p></div><button class="primary" id="demo">Charger une démo</button></div><div class="layout"><aside class="card"><h3>Contexte cognitif</h3><div class="stats"><div class="stat"><span class="muted">Mémoires</span><strong id="mc">0</strong></div><div class="stat"><span class="muted">Décisions</span><strong id="dc">0</strong></div><div class="stat"><span class="muted">Réflexions</span><strong id="rc">0</strong></div></div><div class="ctx" id="ctx"></div><button class="primary" id="refresh" style="width:100%;margin-top:13px">Actualiser</button></aside><article class="card chat"><div class="chathead"><div><strong>Mentor MemoryOS</strong><div class="muted">Mode local de démonstration</div></div><button class="ghost" id="clear">Effacer</button></div><div class="messages" id="messages"></div><div><div class="quick"><button data-q="Où en étais-je sur MemoryOS ?">Où en étais-je ?</button><button data-q="Quelle décision dois-je réévaluer ?">Décision à réévaluer</button><button data-q="Quel est mon principal angle mort ?">Angle mort</button><button data-q="Quelle est la prochaine action ?">Prochaine action</button></div><div class="composer"><textarea id="input" placeholder="Pose une question sur ton raisonnement…"></textarea><button class="primary" id="send">Envoyer</button></div></div></article></div></section></main></div><script>const K='memoryos.mentor.chat';let c={memories:[],decisions:[],reflections:[]},chat=JSON.parse(localStorage.getItem(K)||'[]');function load(){c.memories=JSON.parse(localStorage.getItem('memoryos.memories')||'[]');c.decisions=JSON.parse(localStorage.getItem('memoryos.decisions')||'[]');c.reflections=JSON.parse(localStorage.getItem('memoryos.reflections')||'[]');mc.textContent=c.memories.length;dc.textContent=c.decisions.length;rc.textContent=c.reflections.length;const a=[];c.memories.slice(0,2).forEach(x=>a.push(['Mémoire',x.text||'Capture']));c.decisions.slice(0,2).forEach(x=>a.push(['Décision',x.title||x.text||'Décision']));c.reflections.filter(x=>x.status!=='resolved').slice(0,2).forEach(x=>a.push(['Signal',x.title||'Réflexion']));ctx.innerHTML=a.length?a.map(x=>`<div><strong>${x[0]}</strong><span>${x[1].slice(0,110)}</span></div>`).join(''):'<div class="empty">Aucune donnée locale.</div>'}function esc(s){return s.replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[x]))}function render(){messages.innerHTML=chat.length?chat.map(m=>`<div class="msg ${m.role==='user'?'user':''}">${m.role==='assistant'?'<div class="avatar">M</div>':''}<div class="bubble">${esc(m.text)}${m.sources?.length?`<div class="sources">Sources : ${m.sources.join(' · ')}</div>`:''}</div></div>`).join(''):'<div class="msg"><div class="avatar">M</div><div class="bubble">Je peux t’aider à reprendre un sujet, challenger une décision ou choisir la prochaine action.</div></div>';messages.scrollTop=messages.scrollHeight}function answer(q){const l=q.toLowerCase(),m=c.memories[0],d=c.decisions.find(x=>x.status==='review')||c.decisions[0],r=c.reflections.find(x=>x.status!=='resolved');if(l.includes('où en étais')||l.includes('reprendre'))return m?{text:`Tu avais convergé vers : ${m.text.slice(0,260)}. Transforme maintenant cette conviction en test observable.`,sources:['dernière mémoire']}:{text:'Aucune mémoire locale exploitable.',sources:[]};if(l.includes('décision')||l.includes('réévaluer'))return d?{text:`Réévalue « ${d.title||d.text} ». Confiance actuelle : ${d.confidence??70} %. Vérifie si ses hypothèses sont toujours vraies.`,sources:['Decision Engine']}:{text:'Aucune décision suivie.',sources:[]};if(l.includes('angle mort')||l.includes('biais')||l.includes('contradiction'))return r?{text:`Signal prioritaire : « ${r.title} ». ${r.question||'Quelle preuve permettrait de le confirmer ou de l’écarter ?'}`,sources:['Reflection Engine']}:{text:'Aucun signal ouvert.',sources:[]};if(l.includes('prochaine'))return{text:'Choisis une hypothèse centrale, définis un test court, puis enregistre le résultat : conviction → test → observation → décision révisée.',sources:['synthèse du contexte']};return{text:(m?`Ta dernière mémoire indique : « ${m.text.slice(0,170)} ». `:'')+'Sépare ce que tu sais, ce que tu supposes et ce que tu dois tester. Quelle décision cherches-tu réellement à prendre ?',sources:m?['dernière mémoire']:[]}}function sendQ(q){q=q.trim();if(!q)return;chat.push({role:'user',text:q});const a=answer(q);chat.push({role:'assistant',text:a.text,sources:a.sources});localStorage.setItem(K,JSON.stringify(chat));input.value='';render()}send.onclick=()=>sendQ(input.value);input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendQ(input.value)}};document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>sendQ(b.dataset.q));clear.onclick=()=>{chat=[];localStorage.removeItem(K);render()};refresh.onclick=load;demo.onclick=()=>{localStorage.setItem('memoryos.memories',JSON.stringify([{text:'MemoryOS doit se différencier par la continuité du raisonnement et l’écran Là où tu en étais.',items:[]} ]));localStorage.setItem('memoryos.decisions',JSON.stringify([{title:'Prioriser le parcours de reprise cognitive',confidence:78,status:'review'}]));localStorage.setItem('memoryos.reflections',JSON.stringify([{title:'Automatisation maximale vs validation explicite',status:'open',question:'Quel niveau de friction préserve la confiance ?'}]));load()};load();render();</script></body></html>
