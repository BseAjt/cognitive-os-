name: ExecutiveOS Runtime Tests

on:
  pull_request:
    paths:
      - "executiveos-app/lib/**"
      - "executiveos-app/tests/**"
      - "executiveos-app/package.json"
      - ".github/workflows/runtime-tests.yml"
  push:
    branches: [main]
    paths:
      - "executiveos-app/lib/**"
      - "executiveos-app/tests/**"
      - "executiveos-app/package.json"

jobs:
  runtime-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: executiveos-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: executiveos-app/package-lock.json
      - name: Install dependencies
        run: npm install
      - name: Run runtime regression suite
        run: npm run test:runtime
      - name: TypeScript check
        run: npx tsc --noEmit
