name: ExecutiveOS Full Validation

on:
  pull_request:
    paths:
      - "executiveos-app/**"
      - ".github/workflows/runtime-tests.yml"
  push:
    branches: [main]
    paths:
      - "executiveos-app/**"
      - ".github/workflows/runtime-tests.yml"

jobs:
  full-validation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: executiveos-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run runtime and application tests
        run: npm run test:runtime
      - name: TypeScript check for production application
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: TypeScript check for Playwright tests
        run: npm run test:e2e:typecheck
      - name: Run browser end-to-end tests
        run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: executiveos-app/playwright-report/
          retention-days: 14
