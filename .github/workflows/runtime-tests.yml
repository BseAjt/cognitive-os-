name: ExecutiveOS RC1 Validation

on:
  pull_request:
    paths:
      - "executiveos-app/**"
      - ".github/workflows/runtime-tests.yml"
  push:
    branches: [main]
    paths:
      - "executiveos-app/**"
      - ".github/workflows/runtime-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: executiveos-rc1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: executiveos-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Runtime regression suite
        run: npm run test:runtime

      - name: TypeScript application check
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Playwright typecheck
        run: npm run test:e2e:typecheck

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: executiveos-app/playwright-report/
          retention-days: 14
