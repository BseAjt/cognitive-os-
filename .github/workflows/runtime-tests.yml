name: ExecutiveOS Full Validation

on:
  pull_request:
    paths:
      - "executiveos-app/**"
      - ".github/workflows/runtime-tests.yml"
  push:
    branches: [main]
    paths:
      - "executiveos-app/**"
      - ".github/workflows/runtime-tests.yml"

jobs:
  full-validation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: executiveos-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: executiveos-app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run runtime and application tests
        run: npm run test:runtime
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
