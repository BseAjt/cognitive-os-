name: ExecutiveOS Build

on:
  push:
    branches:
      - agent/fix-vercel-build
      - main
  pull_request:
    paths:
      - "executiveos-app/**"
      - ".github/workflows/executiveos-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: executiveos-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: executiveos-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: executiveos-app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Runtime tests
        run: npm run test:runtime
      - name: Production build
        run: npm run build
