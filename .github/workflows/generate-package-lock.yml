name: Generate ExecutiveOS package lock

on:
  push:
    branches: [main]
    paths:
      - "executiveos-app/package.json"
      - ".github/workflows/generate-package-lock.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: executiveos-lockfile
  cancel-in-progress: true

jobs:
  lockfile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: executiveos-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate package-lock.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile when changed
        run: |
          if git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "package-lock.json already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "RC1 generate deterministic package lock"
          git push origin HEAD:main
